name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-apk:
    name: Build standalone Android APK
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_AI_PREVIEW_URL: https://vlquvrqrvbscpeihyfsu.supabase.co/functions/v1/ai-preview
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK with bundled JavaScript
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload standalone APK
        uses: actions/upload-artifact@v4
        with:
          name: watfa-android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
